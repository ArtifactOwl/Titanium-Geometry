<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111827" />
<title>Titanium Geometry — Receipts (Offline)</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#0070ba; --bg:#f3f4f6; --danger:#dc2626; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); padding:12px; -webkit-text-size-adjust:100%; }
  .wrap { max-width:560px; margin:0 auto; }
  .editor { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .editor h2 { font-size:1rem; margin:0 0 12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  .field input, .field select { width:100%; padding:12px; font-size:1rem; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:var(--ink); }
  .row2 { display:flex; gap:10px; }
  .row2 > * { flex:1; }
  #items .item { display:grid; grid-template-columns:1fr 84px 54px 32px; gap:8px; align-items:center; margin-bottom:8px; }
  #items .item input { padding:10px; font-size:.95rem; border:1px solid #d1d5db; border-radius:8px; width:100%; }
  #items .item .rm { border:none; background:#fee2e2; color:var(--danger); border-radius:8px; height:40px; font-size:1.2rem; cursor:pointer; }
  .items-head { display:grid; grid-template-columns:1fr 84px 54px 32px; gap:8px; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; padding:0 2px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 16px; font-size:1rem; font-weight:600; cursor:pointer; border-radius:8px; border:none; }
  .btn-add { background:#eef2ff; color:#3730a3; margin-top:4px; width:100%; }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn-new { background:#f3f4f6; color:var(--ink); border:1px solid var(--line); flex:1 1 30%; }
  .btn-print { background:#e5e7eb; color:var(--ink); flex:1 1 30%; }
  .btn-share { background:var(--accent); color:#fff; flex:1 1 100%; }
  .btn-label { background:#047857; color:#fff; flex:1 1 100%; }
  #note { font-size:.85rem; color:#b45309; margin-top:10px; }
  .receipt { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; color:#000; }
  .r-head { text-align:center; border-bottom:2px solid #000; padding-bottom:14px; margin-bottom:14px; }
  .r-head img { width:180px; max-width:70%; height:auto; margin:0 auto 8px; display:block; }
  .r-contact { font-size:.78rem; color:#374151; line-height:1.5; }
  .r-meta { display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px; font-size:.82rem; margin-bottom:12px; }
  .r-meta .lbl { color:#6b7280; }
  table.lines { width:100%; border-collapse:collapse; font-size:.88rem; }
  table.lines th { text-align:left; border-bottom:1px solid #000; padding:6px 0; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:#374151; }
  table.lines th.num, table.lines td.num { text-align:right; }
  table.lines td { padding:7px 0; border-bottom:1px solid #e5e7eb; vertical-align:top; }
  .totals { margin-top:12px; margin-left:auto; width:100%; max-width:260px; font-size:.9rem; }
  .totals .t-row { display:flex; justify-content:space-between; padding:4px 0; }
  .totals .grand { border-top:2px solid #000; margin-top:6px; padding-top:8px; font-size:1.15rem; font-weight:700; }
  .r-foot { text-align:center; margin-top:18px; padding-top:12px; border-top:1px dashed #9ca3af; font-size:.82rem; color:#374151; }
  .r-foot strong { color:#000; }
  .hint { font-size:.75rem; color:var(--muted); text-align:center; margin-top:10px; }
  @media print {
    body { background:#fff; padding:0; }
    .editor, .hint, .no-print { display:none !important; }
    .wrap { max-width:none; }
    .receipt { border:none; border-radius:0; padding:8px 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="editor no-print">
    <h2>New Receipt (Offline)</h2>
    <div class="row2">
      <div class="field"><label>Receipt #</label><input id="recNo" inputmode="numeric" /></div>
      <div class="field"><label>Date</label><input id="recDate" type="date" /></div>
    </div>
    <div class="field"><label>Customer (optional)</label><input id="customer" placeholder="Name" /></div>
    <div class="items-head"><span>Item</span><span>Price</span><span>Qty</span><span></span></div>
    <div id="items"></div>
    <button class="btn btn-add" id="addItem" type="button">+ Add item</button>
    <div class="row2" style="margin-top:16px;">
      <div class="field"><label>Discount</label><input id="discount" inputmode="decimal" value="0" /></div>
      <div class="field"><label>Discount type</label>
        <select id="discountType"><option value="amount">$ off</option><option value="percent">% off</option></select>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-new" id="newBtn" type="button">New</button>
      <button class="btn btn-print" id="printBtn" type="button">Print</button>
      <button class="btn btn-share" id="shareBtn" type="button">Share PDF</button>
      <button class="btn btn-label" id="labelBtn" type="button">Label PDF (large font)</button>
    </div>
    <p id="note"></p>
  </section>

  <section class="receipt" id="receipt">
    <div class="r-head">
      <img src="{{LOGO}}" alt="Titanium Geometry" />
      <div class="r-contact" id="contactLine"></div>
    </div>
    <div class="r-meta">
      <div><span class="lbl">Receipt&nbsp;#</span> <span id="oRecNo"></span></div>
      <div><span class="lbl">Date</span> <span id="oDate"></span></div>
    </div>
    <div class="r-meta" id="oCustomerWrap" style="display:none;">
      <div><span class="lbl">Customer</span> <span id="oCustomer"></span></div>
    </div>
    <table class="lines">
      <thead><tr><th>Item</th><th class="num">Price</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
      <tbody id="oLines"></tbody>
    </table>
    <div class="totals">
      <div class="t-row"><span>Subtotal</span><span id="oSubtotal"></span></div>
      <div class="t-row" id="oDiscountRow" style="display:none;"><span id="oDiscountLbl">Discount</span><span id="oDiscount" style="color:var(--danger)"></span></div>
      <div class="t-row"><span>Sales Tax (6.35%)</span><span id="oTax"></span></div>
      <div class="t-row grand"><span>Total</span><span id="oTotal"></span></div>
    </div>
    <div class="r-foot"><strong>Thank you!</strong><br />Each piece is one of a kind.</div>
  </section>

  <p class="hint no-print">Offline copy — works with no internet. Print → “Save as PDF” or send to your label printer. Add to Home Screen to keep it handy.</p>
</div>

<script>{{HTML2CANVAS}}</script>
<script>{{JSPDF}}</script>
<script>
  const BUSINESS = {
    website:  'titanium-geometry.vercel.app',
    facebook: 'facebook.com/titaniumgeometry',
    email:    'titaniumgeometry@gmail.com',
    taxRate:  0.0635
  };
  const $ = (id) => document.getElementById(id);
  const money = (n) => '$' + (Math.round(n * 100) / 100).toFixed(2);
  const note = (msg) => { $('note').textContent = msg || ''; };

  $('contactLine').innerHTML = BUSINESS.website + '<br>' + BUSINESS.facebook + '<br>' + BUSINESS.email;

  function addItemRow(desc = '', price = '', qty = '1') {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<input class="d" placeholder="Description" value="' + desc + '">' +
      '<input class="p" inputmode="decimal" placeholder="0.00" value="' + price + '">' +
      '<input class="q" inputmode="numeric" placeholder="1" value="' + qty + '">' +
      '<button class="rm" type="button" title="Remove">×</button>';
    div.querySelector('.rm').addEventListener('click', () => { div.remove(); render(); });
    div.querySelectorAll('input').forEach(i => i.addEventListener('input', render));
    $('items').appendChild(div);
  }

  function render() {
    const rows = [...document.querySelectorAll('#items .item')];
    let subtotal = 0;
    const lineHTML = [];
    rows.forEach(r => {
      const desc = r.querySelector('.d').value.trim();
      const price = parseFloat(r.querySelector('.p').value) || 0;
      const qty = parseFloat(r.querySelector('.q').value) || 0;
      if (!desc && !price) return;
      const lineTotal = price * qty;
      subtotal += lineTotal;
      lineHTML.push('<tr><td>' + (desc || '&mdash;') + '</td><td class="num">' + money(price) +
        '</td><td class="num">' + qty + '</td><td class="num">' + money(lineTotal) + '</td></tr>');
    });
    $('oLines').innerHTML = lineHTML.join('') ||
      '<tr><td colspan="4" style="color:#9ca3af;padding:12px 0;">No items yet</td></tr>';
    const dVal = parseFloat($('discount').value) || 0;
    const dType = $('discountType').value;
    let discount = dType === 'percent' ? subtotal * (dVal / 100) : dVal;
    if (discount > subtotal) discount = subtotal;
    if (discount < 0) discount = 0;
    const taxable = subtotal - discount;
    const tax = taxable * BUSINESS.taxRate;
    const total = taxable + tax;
    $('oSubtotal').textContent = money(subtotal);
    if (discount > 0) {
      $('oDiscountRow').style.display = 'flex';
      $('oDiscountLbl').textContent = dType === 'percent' ? 'Discount (' + dVal + '%)' : 'Discount';
      $('oDiscount').textContent = '−' + money(discount);
    } else { $('oDiscountRow').style.display = 'none'; }
    $('oTax').textContent = money(tax);
    $('oTotal').textContent = money(total);
    $('oRecNo').textContent = $('recNo').value || '—';
    const d = $('recDate').value;
    $('oDate').textContent = d ? new Date(d + 'T00:00').toLocaleDateString('en-US',
      { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
    const cust = $('customer').value.trim();
    if (cust) { $('oCustomerWrap').style.display = 'flex'; $('oCustomer').textContent = cust; }
    else { $('oCustomerWrap').style.display = 'none'; }
  }

  function nextRecNo() { return parseInt(localStorage.getItem('tg_recNo') || '1000', 10) + 1; }
  function bumpRecNo() { localStorage.setItem('tg_recNo', String(parseInt($('recNo').value, 10) || nextRecNo())); }

  function newReceipt() {
    $('items').innerHTML = '';
    addItemRow();
    $('discount').value = '0';
    $('discountType').value = 'amount';
    $('customer').value = '';
    $('recNo').value = nextRecNo();
    $('recDate').valueAsDate = new Date();
    note('');
    render();
  }

  // ---- PDF (all client-side, works offline) ----
  async function buildPdf(opts) {
    opts = opts || {};
    const canvas = await html2canvas($('receipt'), { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'letter', orientation: opts.landscape ? 'landscape' : 'portrait' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 18;
    const ratio = canvas.width / canvas.height;
    const regionW = (opts.half ? pageW / 2 : pageW) - margin * 2;
    const regionH = pageH - margin * 2;
    let drawW = regionW, drawH = drawW / ratio;
    if (drawH > regionH) { drawH = regionH; drawW = drawH * ratio; }
    const x = margin + (regionW - drawW) / 2;
    const y = margin + (regionH - drawH) / 2;
    pdf.addImage(imgData, 'PNG', x, y, drawW, drawH);
    return pdf;
  }

  async function shareWith(opts, suffix, btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing…'; note('');
    try {
      const pdf = await buildPdf(opts);
      const fileName = 'titaniumgeometry' + ($('recNo').value || 'TG') + (suffix || '') + '.pdf';
      const blob = pdf.output('blob');
      const file = new File([blob], fileName, { type: 'application/pdf' });
      bumpRecNo();
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Receipt ' + $('recNo').value, text: 'Receipt from Titanium Geometry' });
      } else {
        pdf.save(fileName);
        note('Sharing not available here — the PDF was saved to your device. Print it or attach it to an email.');
      }
    } catch (err) {
      if (err && err.name !== 'AbortError') note('Could not make the PDF: ' + (err.message || err));
    }
    btn.disabled = false; btn.textContent = label;
  }

  $('addItem').addEventListener('click', () => { addItemRow(); render(); });
  $('discount').addEventListener('input', render);
  $('discountType').addEventListener('change', render);
  ['recNo', 'recDate', 'customer'].forEach(id => $(id).addEventListener('input', render));
  $('newBtn').addEventListener('click', newReceipt);
  $('printBtn').addEventListener('click', () => { bumpRecNo(); window.print(); });
  $('shareBtn').addEventListener('click', (e) => shareWith({}, '', e.target));
  $('labelBtn').addEventListener('click', (e) => shareWith({ landscape: true, half: true }, '-label', e.target));

  newReceipt();
</script>
</body>
</html>
